<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip,
  PieChart, Pie, Cell, LineChart, Line, ScatterChart, Scatter, ZAxis,
  RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar } = Recharts;

const CAT_COLOR = { airline:"#4c8dff", cargo:"#f0a83c", private:"#9d8cff",
                    military:"#ef5a5a", unknown:"#8a8f9e" };
const CAT_NAME = { airline:"Airline", cargo:"Cargo", private:"Private/GA",
                   military:"Military/Govt", unknown:"Unidentified" };
const PILL = { airline:"p-airline", cargo:"p-cargo", private:"p-private",
               business:"p-business", military:"p-military", unknown:"p-unknown" };
const SERIES = ["#4c8dff","#f0a83c","#9d8cff","#22c58b","#ef5a5a","#54c7d9"];

const ALT_STOPS = [[0,"#e8503a"],[2000,"#f0862c"],[4000,"#f0c020"],[6000,"#a8d020"],
                   [10000,"#22c58b"],[20000,"#3ba5e0"],[30000,"#6b5ce8"],[40000,"#b44ae0"]];
function altColor(a) {
  if (!a || a <= 0) return ALT_STOPS[0][1];
  for (let i = ALT_STOPS.length - 1; i >= 0; i--) if (a >= ALT_STOPS[i][0]) return ALT_STOPS[i][1];
  return ALT_STOPS[0][1];
}

const EV_STYLE = {
  acquired: { icon:"\u2192", color:"#22c58b", verb:"acquired" },
  climb:    { icon:"\u2191", color:"#4c8dff", verb:"climbing" },
  descend:  { icon:"\u2193", color:"#f0a83c", verb:"descending" },
  lost:     { icon:"\u00D7", color:"#8a8f9e", verb:"lost" },
};

function useCountUp(target) {
  const [v, setV] = useState(target);
  const prev = useRef(target);
  useEffect(() => {
    const s = prev.current, e = target;
    if (s === e) return;
    const t0 = performance.now();
    let raf;
    const tick = now => {
      const p = Math.min(1, (now - t0) / 500);
      setV(Math.round(s + (e - s) * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(tick); else prev.current = e;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}

function Kpi({ label, value, sub, delay }) {
  const n = useCountUp(value);
  return (
    <div className="card" style={{ animationDelay: delay + "ms" }}>
      <div className="lab">{label}</div>
      <div className="val">{n.toLocaleString()}</div>
      {sub && <div className="sub">{sub}</div>}
    </div>
  );
}

/* ---------------- offline map (local OpenLayers, no tiles, no internet) --------- */

function FlightMap({ aircraft, receiver, theme, tv, onSelect }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const srcRef = useRef(null);
  const popRef = useRef(null);
  const overlayRef = useRef(null);
  const [sel, setSel] = useState(null);
  const [layers, setLayers] = useState({ aircraft: true, callsigns: true, trails: true, rings: true });
  const [autoFit, setAutoFit] = useState(true);

  useEffect(() => {
    if (mapRef.current || !elRef.current || typeof ol === "undefined") return;

/* ---------------- map base + local flight overlays ----------------------------- */

    const src = new ol.source.Vector();
    const boundarySrc = new ol.source.Vector({
      url: "/geojson/US_ARTCC_boundaries.geojson",
      format: new ol.format.GeoJSON(),
    });

    const dim = getComputedStyle(document.documentElement).getPropertyValue("--dim").trim();

    const map = new ol.Map({
      target: elRef.current,
      layers: [
        new ol.layer.Tile({
          source: new ol.source.XYZ({
            url: "https://{a-c}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            attributions: "© OpenStreetMap contributors",
            crossOrigin: "anonymous",
          }),
        }),
        new ol.layer.Vector({
          source: boundarySrc,
          style: new ol.style.Style({
            stroke: new ol.style.Stroke({ color: "rgba(138,143,158,0.35)", width: 1 }),
          }),
        }),
        new ol.layer.Vector({ source: src }),
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([receiver.lon, receiver.lat]),
        zoom: 8,
      }),
      controls: ol.control.defaults({ attribution: true }),
    });

    const overlay = new ol.Overlay({
      element: popRef.current,
      positioning: "bottom-center",
      offset: [0, -16],
      stopEvent: true,
    });
    map.addOverlay(overlay);

    map.on("singleclick", evt => {
      const f = map.forEachFeatureAtPixel(evt.pixel, ft => ft, { hitTolerance: 8 });
      if (f && f.get("ac")) {
        setSel(f.get("ac"));
        onSelect(f.get("ac"));
        overlay.setPosition(f.getGeometry().getFirstCoordinate
          ? f.getGeometry().getFirstCoordinate() : evt.coordinate);
      } else {
        setSel(null);
        overlay.setPosition(undefined);
      }
    });
    map.on("pointermove", evt => {
      const hit = map.hasFeatureAtPixel(evt.pixel, { hitTolerance: 8 });
      map.getTargetElement().style.cursor = hit ? "pointer" : "";
    });

    mapRef.current = map;
    srcRef.current = src;
    overlayRef.current = overlay;
  }, [receiver, onSelect]);

  useEffect(() => {
    const src = srcRef.current, map = mapRef.current;
    if (!src || !map) return;
    src.clear();

    // receiver + range rings
    const centre = ol.proj.fromLonLat([receiver.lon, receiver.lat]);
    src.addFeature(new ol.Feature({
      geometry: new ol.geom.Point(centre),
      style: null,
    }));
    const rec = new ol.Feature({ geometry: new ol.geom.Point(centre) });
    rec.setStyle(new ol.style.Style({
      image: new ol.style.Circle({
        radius: 5,
        fill: new ol.style.Fill({ color: "#22c58b" }),
        stroke: new ol.style.Stroke({ color: "#fff", width: 1.5 }),
      }),
    }));
    src.addFeature(rec);

    if (layers.rings) [25, 50, 100, 150, 200].forEach(nm => {
      const ring = new ol.Feature({
        geometry: new ol.geom.Circle(centre, nm * 1852),
      });
      ring.setStyle(new ol.style.Style({
        stroke: new ol.style.Stroke({ color: "rgba(138,143,158,0.32)", width: 1, lineDash: [4, 6] }),
      }));
      src.addFeature(ring);
    });

    aircraft.forEach(a => {
      if (layers.trails && a.path && a.path.length >= 2) for (let i = 1; i < a.path.length; i++) {
        const p0 = a.path[i - 1], p1 = a.path[i];
        const seg = new ol.Feature({
          geometry: new ol.geom.LineString([
            ol.proj.fromLonLat([p0.lon, p0.lat]),
            ol.proj.fromLonLat([p1.lon, p1.lat]),
          ]),
        });
        seg.set("ac", a);
        seg.setStyle(new ol.style.Style({
          stroke: new ol.style.Stroke({
            color: altColor(p1.alt),
            width: sel?.hex === a.hex ? 4 : a.live ? 3 : 2,
          }),
        }));
        src.addFeature(seg);
      }

      if (layers.aircraft && a.lastPos) {
        const pt = new ol.Feature({
          geometry: new ol.geom.Point(ol.proj.fromLonLat([a.lastPos.lon, a.lastPos.lat])),
        });
        pt.set("ac", a);
        const col = a.alert?.level === "CRITICAL" ? "#ef5a5a" : altColor(a.maxAlt);
        pt.setStyle(new ol.style.Style({
          image: new ol.style.RegularShape({
            points: 3,
            radius: sel?.hex === a.hex ? 12 : a.live ? 9 : 7,
            rotation: ((a.lastHdg || 0) * Math.PI) / 180,
            fill: new ol.style.Fill({ color: col }),
            stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.5)", width: 1 }),
          }),
            text: layers.callsigns && (sel?.hex === a.hex || a.live) ? new ol.style.Text({
            text: a.registration || a.callsign || a.hex,
            offsetY: -18,
            font: "600 11px -apple-system, sans-serif",
            fill: new ol.style.Fill({ color: col }),
            stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.6)", width: 2.5 }),
            }) : undefined,
        }));
        if (sel?.hex === a.hex) pt.setZIndex(100);
        src.addFeature(pt);
      }
    });

    if (autoFit) {
      const positions = [centre, ...aircraft.filter(a => a.lastPos).map(a => ol.proj.fromLonLat([a.lastPos.lon, a.lastPos.lat]))];
      const ext = ol.extent.boundingExtent(positions);
      if (isFinite(ext[0]) && ext[0] !== ext[2]) {
        map.getView().fit(ext, { padding: [50, 50, 50, 50], maxZoom: 11, duration: 400 });
        map.getView().setZoom(Math.max(8, Math.min(10, map.getView().getZoom())));
      }
    }
  }, [aircraft, receiver, layers, autoFit, sel]);

  useEffect(() => {
    if (mapRef.current) setTimeout(() => mapRef.current.updateSize(), 150);
  }, [theme, tv]);

  return (
    <div className="panel map-wrap">
      <div className="map-cap">Live map · flight paths</div>
      <div className="map-controls"><button className={autoFit ? "on" : ""} onClick={()=>setAutoFit(value=>!value)}>Auto fit</button>{Object.entries({aircraft:"Aircraft", callsigns:"Labels", trails:"Trails", rings:"Rings"}).map(([key,label])=><button key={key} className={layers[key]?"on":""} onClick={()=>setLayers(value=>({...value,[key]:!value[key]}))}>{label}</button>)}</div>
      <div id="olmap" ref={elRef}></div>
      <div ref={popRef}>
        {sel && (
          <div className="ol-popup">
            <span className="ol-close" onClick={() => { setSel(null); overlayRef.current.setPosition(undefined); }}>×</span>
            <div className="t">{sel.callsign || sel.hex}</div>
            <div className="r">
              {sel.registration && <span>Registration {sel.registration}<br/></span>}
              {sel.typeName || sel.typeCode || "Type unknown"}<br/>
              Category: {sel.categoryLabel}<br/>
              Operator: {sel.operatorLabel}<br/>
              {sel.registeredOwner && <span>Registered owner: {sel.registeredOwner}<br/></span>}
              {sel.descText && <span>{sel.descText}<br/></span>}
              {sel.telemetry && <span>
                Geom alt {Math.round(sel.telemetry.altGeom).toLocaleString()} ft ·
                climb {Math.round(sel.telemetry.baroRate)} ft/min<br/>
                IAS {Math.round(sel.telemetry.ias)} · TAS {Math.round(sel.telemetry.tas)} ·
                Mach {sel.telemetry.mach ? sel.telemetry.mach.toFixed(2) : "—"}<br/>
                Squawk {sel.telemetry.squawk || "—"} · ADS-B {sel.telemetry.categoryCode || "—"}<br/>
                Signal {sel.bestRssi ?? "—"} dBFS · seen {sel.telemetry.seen.toFixed(1)}s ago<br/>
              </span>}
              {Math.round(sel.maxAlt).toLocaleString()} ft · {Math.round(sel.maxSpd)} kt<br/>
              {sel.maxDist} NM · {sel.points} hits
              {sel.live && <span style={{ color: "var(--green)" }}><br/>● live</span>}
            </div>
          </div>
        )}
      </div>
      <div className="legend">
        Altitude
        <div className="legend-bar">{ALT_STOPS.map((s, i) => <div key={i} style={{ background: s[1] }}></div>)}</div>
        <div className="legend-sc"><span>0</span><span>10k</span><span>20k</span><span>40k ft</span></div>
      </div>
    </div>
  );
}

function TopList({ items, color, empty }) {
  if (!items || !items.length) return <div className="none">{empty}</div>;
  const max = Math.max(...items.map(i=>i.count));
  return (
    <div className="bars">
      {items.map((it,i)=>(
        <div key={it.name}>
          <div className="bar-row">
            <span className="bar-name">{it.name}</span>
            <span style={{color:"var(--dim)",fontSize:12}}>{it.count}</span>
          </div>
          <div className="bar-track">
            <div className="bar-fill" style={{width:(it.count/max*100)+"%",background:color||SERIES[i%SERIES.length]}}></div>
          </div>
        </div>
      ))}
    </div>
  );
}

function AltitudeTrend({ aircraft }) {
  const top = [...aircraft].sort((a,b)=>b.points-a.points).slice(0,5);
  if (!top.length) return <div className="none">No tracks yet</div>;
  const times = new Set();
  top.forEach(a=>a.track.forEach(p=>times.add(p.t)));
  const data = Array.from(times).sort().map(t=>{
    const row = { t: new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) };
    top.forEach(a=>{ const p = a.track.find(x=>x.t===t); if (p) row[a.hex]=p.alt; });
    return row;
  });
  return (
    <React.Fragment>
      <ResponsiveContainer width="100%" height={210}>
        <LineChart data={data}>
          <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" vertical={false}/>
          <XAxis dataKey="t" tick={{fill:"var(--dim)",fontSize:10}} axisLine={false} tickLine={false} minTickGap={40}/>
          <YAxis tick={{fill:"var(--dim)",fontSize:11}} axisLine={false} tickLine={false}/>
          <Tooltip contentStyle={{background:"var(--panel)",border:"1px solid var(--border)",borderRadius:8,fontSize:12}}/>
          {top.map((a,i)=>(
            <Line key={a.hex} type="monotone" dataKey={a.hex} name={a.callsign||a.hex}
                  stroke={SERIES[i%SERIES.length]} dot={false} strokeWidth={2} connectNulls animationDuration={600}/>
          ))}
        </LineChart>
      </ResponsiveContainer>
      <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:8,fontSize:12,color:"var(--dim)"}}>
        {top.map((a,i)=>(
          <span key={a.hex}>
            <span style={{display:"inline-block",width:9,height:9,borderRadius:2,background:SERIES[i%SERIES.length],marginRight:5}}></span>
            {a.callsign||a.hex}{a.typeCode?" ("+a.typeCode+")":""}
          </span>
        ))}
      </div>
    </React.Fragment>
  );
}

function RangeAlt({ aircraft }) {
  const pts = aircraft.filter(a=>a.maxDist>0).map(a=>({
    x:a.maxDist, y:a.maxAlt, z:a.points, name:a.callsign||a.hex, category:a.category

  if (!pts.length) return <div className="none">No range data yet</div>;
  const byCat = {};

    <React.Fragment>
      <ResponsiveContainer width="100%" height={210}>
        <ScatterChart margin={{top:8,right:12,bottom:4,left:0}}>
          <CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/>
          <XAxis type="number" dataKey="x" name="Range" unit=" NM" tick={{fill:"var(--dim)",fontSize:11}} axisLine={false} tickLine={false}/>
          <YAxis type="number" dataKey="y" name="Altitude" tick={{fill:"var(--dim)",fontSize:11}} axisLine={false} tickLine={false}/>
          <ZAxis type="number" dataKey="z" range={[50,380]}/>

function CoverageChart({ coverage }) {
  const data = coverage.filter((_, i) => i % 4 === 0).map(p => ({
    bearing: `${p.bearing}°`, range: Math.max(p.low, p.mid, p.high),
  }));
  return <ResponsiveContainer width="100%" height={210}><RadarChart data={data}>

      <button className="btn" onClick={()=>setImportantOnly(value=>!value)}>{importantOnly ? "All events" : "Important only"}</button>
      <div className="feed">
        {visibleEvents.map((e,i)=>{
          const s = EV_STYLE[e.kind] || EV_STYLE.acquired;

            <div className="ev" key={e.t+e.hex+e.kind+i} style={{animationDelay:Math.min(i*20,300)+"ms"}}>

                <span className="ev-name">{e.flight || e.hex}</span>

function SessionTimeline({ sessions, onSelect, aircraft }) {
  if (!sessions || !sessions.length) return <div className="none">No complete observed operations yet.</div>;
  return <div className="session-list">{sessions.map(session => {
    const target = aircraft.find(item => item.hex === session.hex);
    return <div className="session-item" key={session.started + session.hex} onClick={() => target && onSelect(target)}>
      <strong>{session.flight || session.hex}</strong>
      <div className="session-meta">{session.status} · {session.durationMinutes} min · {session.observations} observations</div>
      <div className="session-meta">In coverage: {new Date(session.started).toLocaleTimeString()} – {new Date(session.ended).toLocaleTimeString()}</div>
    </div>;
  })}</div>;
}

/* ------------------------------------------------------------- table ----- */

function AircraftTable({ aircraft, onSelect }) {
  const [key, setKey] = useState("last");
  const [dir, setDir] = useState(-1);
  const [flash, setFlash] = useState({});
  const [query, setQuery] = useState("");
  const seen = useRef(new Set());

  useEffect(() => {
    const fresh = {};
    aircraft.forEach(a => { if (!seen.current.has(a.hex)) fresh[a.hex] = true; });
    if (Object.keys(fresh).length) {
      setFlash(f => ({ ...f, ...fresh }));
      setTimeout(() => setFlash(f => {
        const c = { ...f };
        Object.keys(fresh).forEach(k => delete c[k]);
        return c;
      }), 1600);
    }
    seen.current = new Set(aircraft.map(a => a.hex));
  }, [aircraft]);

  const filtered = aircraft.filter(a => `${a.callsign} ${a.hex} ${a.telemetry?.squawk || ""}`.toLowerCase().includes(query.toLowerCase()));
  const sorted = useMemo(() => [...filtered].sort((a,b)=>{
    let av=a[key], bv=b[key];
    if (typeof av === "string") return dir * String(av).localeCompare(String(bv));
    return dir * ((av||0)-(bv||0));
  }), [filtered, key, dir]);

  if (!sorted.length) return <div className="none">Nothing tracked yet in this range.</div>;

  const cols = [["callsign","Flight"],["typeName","Aircraft"],["category","Category"],
                ["last","Last"],["maxAlt","ALT"],["maxSpd","SPD"],
                ["distance","DIST"],["state","V/S"]];

  return (
    <div className="scroll">
      <input className="search" placeholder="Search flight, hex, squawk" value={query} onChange={e=>setQuery(e.target.value)} />
      <table>
        <thead><tr>
          {cols.map(([k,l])=>(
            <th key={k} onClick={()=>{setDir(key===k?-dir:-1); setKey(k);}}>{l}</th>
          ))}
          <th></th>
        </tr></thead>
        <tbody>
          {sorted.map(a=>(
            <tr key={a.hex} className={flash[a.hex]?"new":""} onClick={()=>onSelect(a)} style={{cursor:"pointer"}}>
              <td>
                {a.callsign || <span style={{color:"var(--dim)"}}>{a.hex}</span>}
                {a.callsign && <div className="type-txt">{a.hex}</div>}
              </td>
              <td>
                {a.registration && <div className="type-txt">{a.registration}</div>}
                {a.typeName || a.typeCode || <span style={{color:"var(--dim)"}}>—</span>}
                {a.descText && <div className="type-txt">{a.descText}</div>}
                {a.telemetry && <div className="type-txt">Squawk {a.telemetry.squawk || "—"} · {a.telemetry.categoryCode || "ADS-B"}</div>}
              </td>
              <td>
                <span className={"pill "+PILL[a.category]}>{a.categoryLabel}</span>
                <div className="type-txt">{a.categoryLabel}</div>
              </td>
              <td>{new Date(a.last).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</td>
              <td>{Math.round(a.maxAlt).toLocaleString()}</td>
              <td>{Math.round(a.maxSpd)}</td>
              <td>{a.distance}</td>
              <td className={`state-${a.state}`}>{a.state === "climbing" ? "▲" : a.state === "descending" ? "▼" : "—"}</td>
              <td>{a.live && <span className="live">● LIVE</span>}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function FullscreenToggle({ tv, setTv }) {
  const toggle = async () => {
    const next = !tv;
    setTv(next);
    if (next && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    } else if (!next && document.exitFullscreen) {
      await document.exitFullscreen();
    }
  };
  return <button className="btn" onClick={toggle}>{tv ? "Exit TV" : "TV mode"}</button>;
}

function AircraftDetail({ aircraft, onClose }) {
  if (!aircraft) return null;
  const t = aircraft.telemetry || {};
  const stateLabel = aircraft.state === "climbing" ? "↑ CLIMBING" : aircraft.state === "descending" ? "↓ DESCENDING" : "→ LEVEL";
  const cells = [
    ["ICAO hex", aircraft.hex], ["Flight", aircraft.callsign || "Unknown"],
    ["Altitude", `${Math.round(aircraft.maxAlt).toLocaleString()} ft`], ["Ground speed", `${Math.round(aircraft.maxSpd)} kt`],
    ["Heading", `${Math.round(aircraft.lastHdg || 0)}°`], ["Distance", `${aircraft.distance} nm`],
    ["Bearing", `${aircraft.bearing}°`], ["Vertical rate", `${Math.round(t.baroRate || 0)} ft/min`],
    ["Mach", t.mach ? t.mach.toFixed(2) : "Unknown"], ["Squawk", t.squawk || "Unknown"],
    ["Signal", aircraft.bestRssi == null ? "Unknown" : `${aircraft.bestRssi} dBFS`], ["Position quality", aircraft.quality],
  ];
  return <div className="detail-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <aside className="detail-panel">
      <div className="detail-head"><div><div className="detail-name">{aircraft.callsign || aircraft.hex}</div><div className={`type-txt state-${aircraft.state}`}>{stateLabel} · {aircraft.typeName || aircraft.typeCode || "Aircraft type unknown"}</div></div><button className="detail-close" onClick={onClose}>×</button></div>
      <div className="detail-grid"><div className="detail-cell"><span className="nearest-label">Registration</span><b>{aircraft.registration || "Not identified"}</b></div><div className="detail-cell"><span className="nearest-label">Category</span><b>{aircraft.categoryLabel}</b></div><div className="detail-cell"><span className="nearest-label">Operator</span><b>{aircraft.operatorLabel}</b></div>{aircraft.registeredOwner && <div className="detail-cell"><span className="nearest-label">Registered owner</span><b>{aircraft.registeredOwner}</b></div>}{cells.filter(([,value])=>value !== "Unknown").map(([label,value])=><div className="detail-cell" key={label}><span className="nearest-label">{label}</span><b>{value}</b></div>)}<div className={`detail-cell traffic-${aircraft.trafficDirection}`}><span className="nearest-label">Relative to receiver</span><b>{aircraft.trafficDirection.toUpperCase()}</b></div></div>
      <h2 style={{marginTop:22}}>Autopilot intent</h2>
      <div className="detail-grid">{[["Target altitude (MCP)",t.navAltMcp], ["Target altitude (FMS)",t.navAltFms], ["Target heading",t.navHeading ? `${Math.round(t.navHeading)}°` : ""], ["QNH",t.navQnh ? `${t.navQnh} hPa` : ""], ["Modes",t.navModes]].filter(([,v])=>v!==0&&v!=="").map(([label,value])=><div className="detail-cell" key={label}><span className="nearest-label">{label}</span><b>{value}</b></div>)}</div>
      {aircraft.wind && <><h2 style={{marginTop:22}}>Winds aloft</h2><div className="detail-grid"><div className="detail-cell"><span className="nearest-label">Wind speed</span><b>{aircraft.wind.speed} kt</b></div><div className="detail-cell"><span className="nearest-label">Direction from</span><b>{aircraft.wind.directionFrom}°</b></div></div></>}
      <h2 style={{marginTop:22}}>Engineering</h2>
      <div className="detail-grid">{[["NIC",t.nic],["NACp",t.nacP],["NACv",t.nacV],["SIL",t.sil],["SDA",t.sda],["GVA",t.gva],["Seen",`${t.seen}s`],["Seen position",`${t.seenPos}s`]].filter(([,v])=>v!==0&&v!=="0s").map(([label,value])=><div className="detail-cell" key={label}><span className="nearest-label">{label}</span><b>{value}</b></div>)}</div>
    </aside>
  </div>;
}

/* --------------------------------------------------------------- app ----- */

function App() {
  const [theme, setTheme] = useState(localStorage.getItem("ft-theme") || "dark");
  const [tv, setTv] = useState(localStorage.getItem("ft-tv") === "1");
  const [range, setRange] = useState("today");
  const [ms, setMs] = useState(10000);
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [selected, setSelected] = useState(null);
  const [tvZoom, setTvZoom] = useState(0.78);

  useEffect(()=>{
    const updateTvZoom = () => {
      const availableHeight = Math.max(480, window.innerHeight - 70);
      setTvZoom(Math.max(0.5, Math.min(0.9, availableHeight / 1250)));
    };
    updateTvZoom();
    window.addEventListener("resize", updateTvZoom);
    return () => window.removeEventListener("resize", updateTvZoom);
  },[]);

  useEffect(()=>{
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("ft-theme", theme);
  },[theme]);

  useEffect(()=>{
    document.documentElement.setAttribute("data-tv", tv?"on":"off");
    document.documentElement.style.setProperty("--tv-zoom", tvZoom);
    localStorage.setItem("ft-tv", tv?"1":"0");
  },[tv, tvZoom]);

  const load = useCallback(async ()=>{
    try {
      const r = await fetch(`/api/data?range=${range}`);
      if (!r.ok) throw new Error();
      setData(await r.json());
      setErr(null);
    } catch { setErr("Cannot reach the API — is api_server.py running?"); }
  },[range]);

  useEffect(()=>{ load(); },[load]);
  useEffect(()=>{
    if (!ms) return;
    const id = setInterval(load, ms);
    return ()=>clearInterval(id);
  },[ms,load]);

  const focusAircraft = selected || data?.leaderboard?.nearest;

  return (
    <React.Fragment>
      <header>
        <h1><span className="dot-live"></span> Flight Tracker</h1>
        <div className="ctl">
          <div className="seg">
            <button className={range==="today"?"on":""} onClick={()=>setRange("today")}>Today</button>
            <button className={range==="all"?"on":""} onClick={()=>setRange("all")}>All history</button>
          </div>
          <select value={ms} onChange={e=>setMs(Number(e.target.value))}>
            <option value={0}>Refresh: off</option>
            <option value={5000}>5s</option>
            <option value={10000}>10s</option>
            <option value={30000}>30s</option>
            <option value={60000}>60s</option>
          </select>
          <button className="btn" onClick={()=>setTheme(theme==="dark"?"light":"dark")}>
            {theme==="dark"?"\u2600 Light":"\u263D Dark"}
          </button>
          <FullscreenToggle tv={tv} setTv={setTv}/>
          <span className="stamp">{data && new Date(data.generated_at).toLocaleTimeString()}</span>
        </div>
      </header>

      <main>
        {err && <div className="none">{err}</div>}
        {data && (
          <React.Fragment>
          <div className="dashboard-viewport">
            {data.aircraft.filter(a=>a.alert?.level === "CRITICAL").map(a=><div key={a.hex} className="alert-banner" onClick={()=>setSelected(a)}>● {a.alert.title} · {a.callsign || a.hex} · squawk {a.alert.code || "—"}</div>)}
            <div className="kpis-compact wallboard-kpis">
                <Kpi label="Aircraft" value={data.kpis.unique_aircraft} delay={0}/><Kpi label="Live now" value={data.kpis.live_count} sub={data.kpis.stale_count ? `${data.kpis.stale_count} visible stale` : "last 30 seconds"} delay={40}/>
                <Kpi label="Furthest" value={Math.round(data.kpis.max_range_nm)} sub="NM" delay={80}/><Kpi label="Types seen" value={data.kpis.identified_types} delay={120}/>
                <Kpi label="Busiest hour" value={data.insights.busiest_hour == null ? "—" : `${data.insights.busiest_hour}:00`} delay={160}/><Kpi label="Messages" value={data.kpis.messages_received} delay={200}/>
            </div>
            <div className="wallboard-upper">
              <div className="map-container"><FlightMap aircraft={data.aircraft} receiver={data.receiver} theme={theme} tv={tv} onSelect={setSelected}/></div>
              <section className="selected-summary panel" onClick={()=>focusAircraft&&setSelected(focusAircraft)}>
                <h2>Selected / nearest aircraft</h2>
                {focusAircraft ? <><div className="nearest-name">{focusAircraft.registration || focusAircraft.callsign || focusAircraft.hex}</div><div className="type-txt">{focusAircraft.registration && `${focusAircraft.hex} · `}{focusAircraft.typeName || focusAircraft.typeCode || "Aircraft type unknown"}</div><div className="summary-stats"><b>{Math.round(focusAircraft.maxAlt).toLocaleString()} ft</b><b>{Math.round(focusAircraft.maxSpd)} kt</b><b className={`state-${focusAircraft.state}`}>{focusAircraft.state}</b><b className={`traffic-${focusAircraft.trafficDirection}`}>{focusAircraft.trafficDirection}</b><b>{focusAircraft.distance} nm · {focusAircraft.bearing}°</b></div><div className="type-txt">{focusAircraft.quality} position quality · {focusAircraft.live ? "LIVE" : `STALE · last seen ${new Date(focusAircraft.last).toLocaleTimeString()}`} · {focusAircraft.telemetry?.squawk || "No squawk"}</div><div className="detail-mini-chart"><AltitudeTrend aircraft={[focusAircraft]}/></div></> : <div className="none">Select an aircraft on the map</div>}
              </section>
            </div>
            <div className="wallboard-lower">
              <div className="panel lower-panel"><h2>Aircraft</h2><AircraftTable aircraft={data.aircraft} onSelect={setSelected}/></div>
              <div className="panel lower-panel analytics-panel"><h2>Flight operations</h2><SessionTimeline sessions={data.sessions} aircraft={data.aircraft} onSelect={setSelected}/></div>
              <div className="panel lower-panel"><h2>Events</h2><div className="events-compact"><EventFeed events={data.events}/></div></div>
            </div>
          </div>
          <div className="dashboard-footer">Receiver online · ADS-B telemetry · 5-second capture · {data.kpis.messages_received.toLocaleString()} messages · Updated {new Date(data.generated_at).toLocaleTimeString()}</div>
          </React.Fragment>
        )}
      </main>
      <AircraftDetail aircraft={selected} onClose={()=>setSelected(null)}/>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
